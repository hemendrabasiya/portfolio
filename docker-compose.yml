services:
  portfolio:
    container_name: portfolio

    build:
      context: .
      dockerfile: Dockerfile

    image: hemendra/portfolio:1.0.0

    expose:
      - "80"

    restart: unless-stopped

    networks:
      - proxy-network

networks:
  proxy-network:
    external: true


  services:
  npm:
    image: jc21/nginx-proxy-manager:latest

    container_name: nginx-proxy-manager

    restart: unless-stopped

    ports:
      - "80:80"
      - "81:81"
      - "443:443"

    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt

    networks:
      - proxy-network

networks:
  proxy-network:
    external: true